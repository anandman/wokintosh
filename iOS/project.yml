name: WokintoshPhone
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
packages:
  Wokintosh:
    path: ..
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '2.1.0'
    CURRENT_PROJECT_VERSION: '23'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WokintoshPhone:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
    dependencies:
      - package: Wokintosh
        product: WokintoshCore
      - target: WokintoshAgentWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOKINTOSH_PHONE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wokintosh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the private pairing code shown by Wokintosh on your Mac.
        WokintoshAppGroupIdentifier: $(WOKINTOSH_PHONE_APP_GROUP_ID)
        WokintoshKeychainAccessGroup: $(AppIdentifierPrefix)$(WOKINTOSH_PHONE_BUNDLE_ID).shared
        CFBundleURLTypes:
          - CFBundleURLName: dev.wokintosh.phone
            CFBundleURLSchemes: [wokintosh]
    entitlements:
      path: App/WokintoshPhone.entitlements
      properties:
        com.apple.security.application-groups: [$(WOKINTOSH_PHONE_APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(WOKINTOSH_PHONE_BUNDLE_ID).shared]
  WokintoshAgentWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: Wokintosh
        product: WokintoshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOKINTOSH_PHONE_BUNDLE_ID).agents
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Wokintosh Agents
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WokintoshAppGroupIdentifier: $(WOKINTOSH_PHONE_APP_GROUP_ID)
        WokintoshKeychainAccessGroup: $(AppIdentifierPrefix)$(WOKINTOSH_PHONE_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/WokintoshAgentWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(WOKINTOSH_PHONE_APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(WOKINTOSH_PHONE_BUNDLE_ID).shared]
  WokintoshPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      - App/PhoneStore.swift
      - Widget/WidgetModels.swift
      - Widget/AgentWidgetView.swift
    dependencies:
      - package: Wokintosh
        product: WokintoshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WOKINTOSH_PHONE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WokintoshPhone:
    build:
      targets:
        WokintoshPhone: all
    test:
      targets: [WokintoshPhoneTests]
  WokintoshPhoneTests:
    build:
      targets:
        WokintoshPhoneTests: [test]
    test:
      targets: [WokintoshPhoneTests]
