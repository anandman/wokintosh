name: WokintoshPhone
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
packages:
  Wokintosh:
    path: ..
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  WokintoshPhone:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
    dependencies:
      - package: Wokintosh
        product: WokintoshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wokintosh.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wokintosh
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Scan the private pairing code shown by Wokintosh on your Mac.
        WokintoshKeychainAccessGroup: $(AppIdentifierPrefix)dev.wokintosh.phone.shared
        CFBundleURLTypes:
          - CFBundleURLName: dev.wokintosh.phone
            CFBundleURLSchemes: [wokintosh]
    entitlements:
      path: App/WokintoshPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.wokintosh.phone.shared]
        keychain-access-groups: [$(AppIdentifierPrefix)dev.wokintosh.phone.shared]
  WokintoshPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
    dependencies:
      - package: Wokintosh
        product: WokintoshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.wokintosh.phone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WokintoshPhone:
    build:
      targets:
        WokintoshPhone: all
    test:
      targets: [WokintoshPhoneTests]
  WokintoshPhoneTests:
    build:
      targets:
        WokintoshPhoneTests: [test]
    test:
      targets: [WokintoshPhoneTests]
